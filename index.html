<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dummy Site</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #f8fafc; text-align: center; padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 12px; font-size: 2.75rem; }
    p { margin: 0; font-size: 1.1rem; color: #cbd5e1; }
    .badge {
      display: inline-block; margin-top: 24px; padding: 8px 16px;
      border-radius: 999px; background: #22c55e; color: #052e16;
      font-weight: 700; font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>It works! 🎉</h1>
    <p>This is a dummy site deployed to GitHub Pages.</p>
    <span class="badge">Deployed successfully</span>
  </div>
</body>
</html>
